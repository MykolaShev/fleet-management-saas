name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      # - name: Lint
      #   uses: golangci/golangci-lint-action@v6

  docker-and-api-tests:
    runs-on: ubuntu-latest
    needs: build-and-test # don't spend Docker build time if the quick tests already failed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # C4 evidence: builds the real image, brings up the full stack, waits
      # for /health, exercises one real CRUD call, tears down. Same script
      # used locally via `make smoke-test` — no CI-only special-casing.
      - name: Docker smoke test
        run: bash scripts/smoke-test.sh

      # QA1 evidence: the full Postman/Newman collection against the real
      # containerized stack. GitHub's ubuntu-latest runners ship with
      # Docker and Node.js preinstalled, so this needs no extra setup.
      - name: Bring up full stack for API tests
        run: docker compose -f deployments/docker/docker-compose.yml --profile full up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose -f deployments/docker/docker-compose.yml --profile full logs api
          exit 1

      - name: Run Postman collection (Newman)
        run: |
          npx --yes newman run test/postman/fleet-management.postman_collection.json \
            -e test/postman/fleet-management-local.postman_environment.json

      - name: Tear down
        if: always()
        run: docker compose -f deployments/docker/docker-compose.yml --profile full down -v