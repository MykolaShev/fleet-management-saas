services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet_management
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP — cmd/api and cmd/worker both connect here
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest) — good for the B8 demo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    environment:
      APP_ENV: "local" # enables POST /api/v1/auth/dev-token — never set this in a real deployment
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fleet_management
      DB_SSLMODE: disable
      REDIS_ADDR: "redis:6379"
      CACHE_BACKEND: "redis" # Redis is already a healthy dependency here; bare `go run` without Docker defaults to memory instead
      JWT_SECRET: "local-dev-only-secret-do-not-use-in-prod"
      LLM_API_KEY: "${LLM_API_KEY:-}" # pulled from the host's own env/.env, not hardcoded here
      LLM_MODEL: "llama-3.3-70b-versatile"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}" # empty -> notifications disabled, see cmd/api/main.go
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.worker
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata: