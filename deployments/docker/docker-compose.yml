services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet_management
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    environment:
      APP_ENV: "local" # enables POST /api/v1/auth/dev-token — never set this in a real deployment
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fleet_management
      DB_SSLMODE: disable
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "local-dev-only-secret-do-not-use-in-prod"
      LLM_API_KEY: "${LLM_API_KEY:-}" # pulled from the host's own env/.env, not hardcoded here
      LLM_MODEL: "llama-3.3-70b-versatile"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: